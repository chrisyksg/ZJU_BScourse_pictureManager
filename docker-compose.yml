# docker-compose.yml
version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: picture_manager_db
    env_file: .env.docker  # 从文件读取，不要硬编码！
    ports:
      - "3307:3306"  # 改为 3307，避免冲突
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Node.js 后端服务
  backend:
    build: ./backend
    container_name: picture_manager_backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env.docker  # 使用同一个环境文件
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    # 不再需要在容器内生成 .env 文件

  # React 前端服务
  frontend:
    build: ./frontend
    container_name: picture_manager_frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  mysql_data: